name: Projects Root Cause Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [projects-root-cause-fix]
    paths:
      - 'src/lib/project-store.ts'
      - '.github/workflows/projects-root-cause-validation.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --fund=false
      - run: npm run typecheck
      - run: npm run build
