name: StreamEarn Daily Append

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamearn-daily-append
  cancel-in-progress: false

jobs:
  append-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Append new feed records to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/append-scheduled-to-supabase.mjs

      - name: Verify repository was not modified
        run: git diff --exit-code -- src/data/scheduled || (echo 'Scheduler must never rewrite legacy feed data' && exit 1)
