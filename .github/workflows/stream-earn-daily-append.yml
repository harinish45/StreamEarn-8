name: StreamEarn Daily Verification Pipeline

on:
  schedule:
    # GitHub Actions schedules run in UTC. 02:30 UTC = 08:00 IST.
    - cron: '30 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-active-feeds.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/stream-earn-daily-append.yml'

permissions:
  contents: read

concurrency:
  group: streamearn-daily-verify
  cancel-in-progress: false

jobs:
  verify-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Run Active-Data Verification Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-active-feeds.mjs

      - name: Verify repository was not modified
        run: git diff --exit-code -- src/data/scheduled || (echo 'Scheduler must never modify local JSON data directly' && exit 1)
