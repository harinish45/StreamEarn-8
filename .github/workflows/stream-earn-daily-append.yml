name: StreamEarn Daily Append

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streamearn-daily-append
  cancel-in-progress: false

jobs:
  append-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Append new feed records
        run: node scripts/append-scheduled-feeds.mjs

      - name: Commit only if new records were added
        run: |
          git config user.name 'StreamEarn Scheduler'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/scheduled/*.json
          if git diff --cached --quiet; then
            echo 'No new records. Existing data was left untouched.'
            exit 0
          fi
          git commit -m 'chore(scheduler): append daily StreamEarn opportunities'
          git push origin HEAD:main
