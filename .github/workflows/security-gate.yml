name: Security and Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependency tree
        run: npm ci --ignore-scripts

      - name: Use current npm audit client
        run: npm install --global npm@11

      - name: Dependency audit
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "npm audit attempt $attempt/3"
            if npm audit --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Dependency audit failed after 3 attempts."
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
