name: Security and Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create or refresh deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if ! git status --porcelain -- package-lock.json | grep -q .; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock npm dependency tree" || true
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --hard origin/main; npm install --package-lock-only --ignore-scripts; git add package-lock.json; git commit -m "chore: lock npm dependency tree" || true; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Unable to publish deterministic lockfile after 3 attempts" >&2
          exit 1

      - name: Install exact dependency tree
        run: npm ci --ignore-scripts

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
