name: Security and Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependency tree
        run: npm ci --ignore-scripts

      - name: Use current npm audit client
        run: npm install --global npm@11

      - name: Dependency audit
        run: |
          set -o pipefail
          report="$(mktemp)"
          if npm audit --audit-level=high 2>&1 | tee "$report"; then
            exit 0
          fi
          if grep -Eqi '503 Service Unavailable|currently performing maintenance|400 Bad Request.*Invalid package tree|audit endpoint returned an error' "$report"; then
            echo "::warning::npm advisory service is temporarily unavailable; dependency audit will be retried by the next gate run."
            exit 0
          fi
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
