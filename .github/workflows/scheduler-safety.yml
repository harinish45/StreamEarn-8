name: Scheduler Safety Build

on:
  push:
    branches: [scheduler-safety-fix]
    paths:
      - 'src/app/api/scheduler/**'
      - 'src/lib/scheduler-categories.ts'
      - '.github/workflows/scheduler-safety.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --fund=false
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
